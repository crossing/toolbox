[project]
name = "op-mcp"
version = "0.1.0"
description = "Presence-scoped MCP service for the 1Password-backed OAuth CLIs"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    # Pinned below 2.0: the server session adapter (mcp_session.py) is written
    # against the stable 1.x lowlevel Server / SessionMessage API.
    "mcp>=1.12,<2",
]

[project.scripts]
op-mcp = "op_mcp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/op_mcp"]
