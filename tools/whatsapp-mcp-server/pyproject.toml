[project]
name = "whatsapp-mcp-server"
version = "0.1.0"
description = "MCP server over the whatsapp-bridge message store (read-only by default)"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    # 1.6.x exactly, the version the fork was proven against: 2.0 removed
    # mcp.server.fastmcp, and newer 1.x releases validate tool output against
    # the Dict annotations, rejecting the dataclasses these tools return
    # (seen live with 1.29: "Error executing tool list_chats: validation
    # errors for list_chatsOutput").
    "mcp[cli]>=1.6.0,<1.7",
    "requests>=2.32.3",
]

[project.scripts]
whatsapp-mcp-server = "whatsapp_mcp_server.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
